<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="/resources/styles/document_style.css">
</head>
<body>
  <!-- ШАПКА -->
  <header class="app-header">
    <div class="header-left">
      <a href="/" class="logo-wrap">
        <img src="/resources/img/docs_2020q4_48dp.png" alt="Документы" class="logo">
      </a>
      <a href="/" class="title-link">
        <span class="title">Документы</span>
      </a>
    </div>
  </header>

  <!-- ОСНОВНОЙ КОНТЕНТ -->
  <main class="content">
    <div class="doc-container">
      <img src="/resources/img/{{ .Type }}.png" alt="{{ .Type }}" class="doc-image">

      <div class="doc-info">
        <h2 class="doc-title">{{ .Title }}</h2>

        <p><strong>Тип документа:</strong> {{ .Type }}</p>
        <p><strong>Дата создания:</strong> {{ formatDate .CreatedAt }}</p>
        <p><strong>Последнее изменение:</strong> {{ formatDate .UpdatedAt }}</p>
        <p><strong>Статус:</strong> {{ .Status }}</p>

        {{ if .Description }}
          <p class="doc-description">{{ .Description }}</p>
        {{ end }}

      </div>
    </div>
  </main>
</body>
</html>
