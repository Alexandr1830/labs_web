<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Документы</title>
  <link rel="stylesheet" href="/resources/styles/index_style.css">
  <style>
    /* Чтобы карточка-ссылка не была подчёркнута */
    .card-link {
      text-decoration: none;
      color: inherit;
      display: block;
    }
  </style>
</head>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // Пробуем залогиниться автоматически
  fetch("/login", {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email: "ivanov@mail.ru",   // ← твой логин
      password: "hash123"        // ← твой пароль
    })
  })
  .then(res => res.json())
  .then(data => {
    console.log("Auth:", data);
  })
  .catch(err => console.error("Login error:", err));

});
</script>


<body>

  <!-- == ШАПКА == -->
  <header class="app-header">
    <div class="header-left">
      <a href="/" class="logo-wrap">
        <img src="/resources/img/docs_2020q4_48dp.png" class="logo" alt="Документы">
      </a>
      <a href="/" class="title-link">
        <span class="title">Документы</span>
      </a>
    </div>
  </header>


  <!-- == ПОИСК + ЗАЯВКА == -->
  <div class="search-row" style="display:flex; justify-content:center; align-items:center; gap:40px;">

    <!-- Поиск -->
    <form method="get" action="/" class="search-box">
      <img src="/resources/img/icon.png" class="search-icon">
      <input type="text" name="query" placeholder="Поиск документов..." value="{{ .query }}">
    </form>

    <!-- Заявка -->
    {{ if .AppID }}
      <a href="/document-request/{{ .AppID }}" class="cart-link" style="text-decoration:none;">
        <img src="/resources/img/cart.png" class="cart-icon" alt="Заявка">
        <span class="cart-count">{{ .AppCount }}</span>
      </a>
    {{ else }}
      <div class="cart-link" style="opacity:0.5; pointer-events:none; text-decoration:none;">
        <img src="/resources/img/cart.png" class="cart-icon" alt="Заявка">
        <span class="cart-count">{{ .AppCount }}</span>
      </div>
    {{ end }}

  </div>


  <!-- == КАРТОЧКИ ДОКУМЕНТОВ == -->
  <main class="content">

    <div class="cards">
      {{ range .documents }}

      <a href="/document/{{ .DocumentID }}" class="card-link">
        <div class="card">

          <!-- Иконка -->
          <div class="card-icon">
            <img src="/resources/img/{{ .Type }}.png" alt="{{ .Type }}">
          </div>

          <hr class="card-line">

          <!-- Информация -->
          <div class="card-info centered">

            <div class="meta-left centered">
              <span class="card-title center">{{ .Title }}</span>
              <span class="card-date center">Тип: {{ .Type }}</span>
              <span class="card-date center">Автор: {{ if .Creator.Username }}{{ .Creator.Username }}{{ else }}-{{ end }}</span>
              <span class="card-date center">Создан: {{ formatDate .CreatedAt }}</span>
              <span class="card-date center">Статус: {{ .Status }}</span>
            </div>

            <!-- Добавить в заявку -->
            <form method="POST" action="/document-request/add/{{ .DocumentID }}" onclick="event.stopPropagation();" class="center">
              <button class="edit-btn">Добавить</button>
            </form>

          </div>

        </div>
      </a>

      {{ end }}
    </div>

  </main>

</body>
</html>
